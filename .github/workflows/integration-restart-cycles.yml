name: Repeated restart acceptance\n\non:\n  workflow_dispatch:\n  push:\n    paths:\n      - ".github/workflows/integration-restart-cycles.yml"\n      - "bench/obsidian-restart-cycle-probe.mjs"\n\npermissions:\n  contents: read\n\njobs:\n  restart-cycles:\n    runs-on: ubuntu-latest\n    timeout-minutes: 40\n    env:\n      NOTE_COUNT: "12000"\n      BACKGROUND_COUNT: "300"\n      CYCLE_PAIRS: "3"\n      OBSIDIAN_VERSION: "1.13.7"\n\n    steps:\n      - uses: actions/checkout@v4\n\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 20\n          cache: npm\n\n      - name: Verify exact accepted candidate and install harness deps\n        run: |\n          sha256sum -c artifact-sha256.txt\n          npm ci\n          npm install --no-save chrome-remote-interface\n\n      - name: Install Obsidian\n        run: |\n          sudo apt-get update\n          sudo apt-get install -y xvfb\n          curl -L --retry 3 -o "$RUNNER_TEMP/obsidian.deb" "https://github.com/obsidianmd/obsidian-releases/releases/download/v${OBSIDIAN_VERSION}/obsidian_${OBSIDIAN_VERSION}_amd64.deb"\n          sudo apt-get install -y "$RUNNER_TEMP/obsidian.deb"\n\n      - name: Prepare disposable restart vault\n        run: |\n          VAULT="$RUNNER_TEMP/mdse-restart-cycles"\n          echo "VAULT=$VAULT" >> "$GITHUB_ENV"\n          rm -rf "$VAULT"\n          mkdir -p "$VAULT/.obsidian/plugins/mdse-workbench" "$VAULT/Background"\n          cp -R vault/99_System "$VAULT/99_System"\n          npm run bench:generate -- "$NOTE_COUNT" "$VAULT/IntegrationData"\n          cp main.js manifest.json styles.css "$VAULT/.obsidian/plugins/mdse-workbench/"\n          printf '%s\n' '["mdse-workbench"]' > "$VAULT/.obsidian/community-plugins.json"\n          printf '%s\n' '{"settings":{"warmCachePreview":true}}' > "$VAULT/.obsidian/plugins/mdse-workbench/data.json"\n          cat > "$VAULT/.vault.yaml" <<'EOF'\n          vault_uid: 20261004235900000restartaccept\n          vault_name: MDSE Restart Acceptance\n          default_branch: main\n          EOF\n          cat > "$VAULT/Background/Target.md" <<'EOF'\n          ---\n          type: Object\n          id: RESTART-TARGET\n          uid: 20261004235900001restarttarget\n          ---\n          # Target\n          EOF\n          for i in $(seq 1 "$BACKGROUND_COUNT"); do\n            cat > "$VAULT/Background/Owner $i.md" <<EOF\n          ---\n          type: Object\n          id: RESTART-OWNER-$i\n          uid: 20261004235$(printf "%07d" "$i")restartxx\n          ---\n          # Owner $i\n\n          ## Local Model\n          <!-- MDSE:LOCAL-MODEL START schema=0.2 -->\n\n          ### Part Occurrences\n\n          #### Child $i\n          - definition: [[Target]]\n          ^part-20261004235$(printf "%07d" "$i")restartxx\n\n          <!-- MDSE:LOCAL-MODEL END -->\n          EOF\n          done\n\n      - name: Run repeated cold/warm restart pairs\n        run: |\n          export VAULT\n          : > restart-cycle-summary.ndjson\n          total=$((CYCLE_PAIRS * 2))\n          for cycle in $(seq 1 "$total"); do\n            if [ $((cycle % 2)) -eq 1 ]; then\n              kind="cold"\n              rm -rf "$VAULT/.obsidian/plugins/mdse-workbench/cache"\n            else\n              kind="warm"\n            fi\n            label="${kind}-${cycle}"\n            export XDG_CONFIG_HOME="$RUNNER_TEMP/xdg-restart-${cycle}"\n            mkdir -p "$XDG_CONFIG_HOME/obsidian"\n            node -e 'const fs=require("fs"),p=require("path");fs.writeFileSync(p.join(process.env.XDG_CONFIG_HOME,"obsidian","obsidian.json"),JSON.stringify({vaults:{restart:{path:process.env.VAULT,ts:Date.now(),open:true}}},null,2))'\n            rm -f "$VAULT/.mdse_integration_result.json"\n            node -e 'const fs=require("fs");fs.writeFileSync(process.env.VAULT+"/.mdse_integration_probe.json",JSON.stringify({launchStartedAt:Date.now(),label:process.argv[1]},null,2))' "$label"\n            pkill -9 -x obsidian 2>/dev/null || true\n            sleep 2\n            xvfb-run -a bash -euo pipefail -c "/usr/bin/obsidian --no-sandbox --disable-gpu --js-flags=--expose-gc --remote-debugging-port=9253 >\"$RUNNER_TEMP/restart-${cycle}.log\" 2>&1 & PID=\$!; trap 'kill \$PID 2>/dev/null || true' EXIT; node bench/obsidian-e2e-activate.mjs \"$VAULT\" 9253 >\"$RUNNER_TEMP/restart-${cycle}-activate.log\" 2>&1; node bench/obsidian-restart-cycle-probe.mjs \"$VAULT\" 9253 \"$label\" | tee \"restart-cycle-${cycle}.json\""\n            node -e 'const fs=require("fs");const probe=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));let startup={};try{startup=JSON.parse(fs.readFileSync(process.env.VAULT+"/.mdse_integration_result.json","utf8"));}catch{};const row={cycle:Number(process.argv[2]),kind:process.argv[3],...probe,launchToReadableMs:startup.launchToReadableMs??null,launchToMetadataMs:startup.launchToMetadataMs??null,launchToCoreReadyMs:startup.launchToCoreReadyMs??null,launchToOccurrenceReadyMs:startup.launchToOccurrenceReadyMs??null};fs.appendFileSync("restart-cycle-summary.ndjson",JSON.stringify(row)+"\n")' "restart-cycle-${cycle}.json" "$cycle" "$kind"\n            pkill -9 -x obsidian 2>/dev/null || true\n            sleep 2\n          done\n\n      - name: Validate restart semantics and scheduling\n        run: |\n          node <<'NODE'\n          const fs=require("fs");\n          const rows=fs.readFileSync("restart-cycle-summary.ndjson","utf8").trim().split(/\n+/).map(JSON.parse);\n          const fail=(m)=>{throw new Error(m)};\n          if(rows.length!==Number(process.env.CYCLE_PAIRS)*2) fail("missing restart cycle evidence");\n          const baseline=rows[0];\n          for(const r of rows){\n            if(!r.accepted) fail(`cycle ${r.cycle} probe not accepted`);\n            if(r.files!==baseline.files || r.elements!==baseline.elements || r.links!==baseline.links) fail(`cycle ${r.cycle} semantic counts drifted`);\n            if(r.sourcePending) fail(`cycle ${r.cycle} source reconciliation remained pending`);\n            if(r.livePending!==0) fail(`cycle ${r.cycle} live updates remained pending`);\n            if(r.occurrencePending!==0 || r.occurrenceQueued!==0 || r.occurrenceActive!==0) fail(`cycle ${r.cycle} occurrence work did not settle`);\n            if(r.localReadErrors!==0) fail(`cycle ${r.cycle} Local Model read errors remained`);\n            if(r.kind==="cold" && r.mode!=="full") fail(`cycle ${r.cycle} cold launch was not full mode`);\n            if(!Number.isFinite(r.launchToCoreReadyMs)) fail(`cycle ${r.cycle} never recorded core readiness`);\n          }\n          const summarize=(kind)=>{\n            const s=rows.filter(r=>r.kind===kind);\n            return {count:s.length,heapUsedBytes:s.map(r=>r.jsHeapUsedBytes),coreReadyMs:s.map(r=>r.launchToCoreReadyMs),modes:s.map(r=>r.mode),warmRestore:s.map(r=>r.warmRestore)};\n          };\n          const out={accepted:true,semanticBaseline:{files:baseline.files,elements:baseline.elements,links:baseline.links},cold:summarize("cold"),warm:summarize("warm"),cycles:rows};\n          fs.writeFileSync("restart-acceptance.json",JSON.stringify(out,null,2)+"\n");\n          console.log(JSON.stringify(out,null,2));\n          NODE\n\n      - uses: actions/upload-artifact@v4\n        if: always()\n        with:\n          name: restart-cycle-evidence\n          path: |\n            restart-cycle-*.json\n            restart-cycle-summary.ndjson\n            restart-acceptance.json\n            ${{ runner.temp }}/restart-*.log\n          if-no-files-found: warn\n