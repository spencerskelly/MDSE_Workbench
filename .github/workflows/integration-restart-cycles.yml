name: Repeated restart acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/integration-restart-cycles.yml"
      - "bench/obsidian-restart-cycle-probe.mjs"

permissions:
  contents: read

jobs:
  restart-cycles:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NOTE_COUNT: "12000"
      BACKGROUND_COUNT: "300"
      CYCLE_PAIRS: "3"
      OBSIDIAN_VERSION: "1.13.7"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify exact accepted candidate and install harness deps
        run: |
          sha256sum -c artifact-sha256.txt
          npm ci
          npm install --no-save chrome-remote-interface

      - name: Install Obsidian
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          curl -L --retry 3 -o "$RUNNER_TEMP/obsidian.deb" "https://github.com/obsidianmd/obsidian-releases/releases/download/v${OBSIDIAN_VERSION}/obsidian_${OBSIDIAN_VERSION}_amd64.deb"
          sudo apt-get install -y "$RUNNER_TEMP/obsidian.deb"

      - name: Prepare disposable restart vault
        run: |
          VAULT="$RUNNER_TEMP/mdse-restart-cycles"
          echo "VAULT=$VAULT" >> "$GITHUB_ENV"
          rm -rf "$VAULT"
          mkdir -p "$VAULT/.obsidian/plugins/mdse-workbench" "$VAULT/Background"
          cp -R vault/99_System "$VAULT/99_System"
          npm run bench:generate -- "$NOTE_COUNT" "$VAULT/IntegrationData"
          cp main.js manifest.json styles.css "$VAULT/.obsidian/plugins/mdse-workbench/"
          printf '%s\n' '["mdse-workbench"]' > "$VAULT/.obsidian/community-plugins.json"
          printf '%s\n' '{"settings":{"warmCachePreview":true}}' > "$VAULT/.obsidian/plugins/mdse-workbench/data.json"
          cat > "$VAULT/.vault.yaml" <<'EOF'
          vault_uid: 20261004235900000restartaccept
          vault_name: MDSE Restart Acceptance
          default_branch: main
          EOF
          cat > "$VAULT/Background/Target.md" <<'EOF'
          ---
          type: Object
          id: RESTART-TARGET
          uid: 20261004235900001restarttarget
          ---
          # Target
          EOF
          for i in $(seq 1 "$BACKGROUND_COUNT"); do
            cat > "$VAULT/Background/Owner $i.md" <<EOF
          ---
          type: Object
          id: RESTART-OWNER-$i
          uid: 20261004235$(printf "%07d" "$i")restartxx
          ---
          # Owner $i

          ## Local Model
          <!-- MDSE:LOCAL-MODEL START schema=0.2 -->

          ### Part Occurrences

          #### Child $i
          - definition: [[Target]]
          ^part-20261004235$(printf "%07d" "$i")restartxx

          <!-- MDSE:LOCAL-MODEL END -->
          EOF
          done

      - name: Seed one known-good warm cache
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg-restart-seed
        run: |
          mkdir -p "$XDG_CONFIG_HOME/obsidian"
          export VAULT
          node -e 'const fs=require("fs"),p=require("path");fs.writeFileSync(p.join(process.env.XDG_CONFIG_HOME,"obsidian","obsidian.json"),JSON.stringify({vaults:{restart:{path:process.env.VAULT,ts:Date.now(),open:true}}},null,2))'
          rm -rf "$VAULT/.obsidian/plugins/mdse-workbench/cache" "$RUNNER_TEMP/restart-seed-cache"
          rm -f "$VAULT/.mdse_integration_result.json" "$VAULT/.mdse_integration_readable.json" "$VAULT/.mdse_integration_metadata.json"
          node -e 'const fs=require("fs");fs.writeFileSync(process.env.VAULT+"/.mdse_integration_probe.json",JSON.stringify({launchStartedAt:Date.now(),label:"restart-seed"},null,2))'
          pkill -9 -x obsidian 2>/dev/null || true
          sleep 2
          xvfb-run -a bash -euo pipefail -c '
            /usr/bin/obsidian --no-sandbox --disable-gpu --remote-debugging-port=9253 >"$RUNNER_TEMP/restart-seed.log" 2>&1 &
            PID=$!
            trap "kill $PID 2>/dev/null || true" EXIT
            node bench/obsidian-e2e-activate.mjs "$VAULT" 9253 >"$RUNNER_TEMP/restart-seed-activate.log" 2>&1
            for i in $(seq 1 240); do
              if ls "$VAULT/.obsidian/plugins/mdse-workbench/cache"/manifest-*.json >/dev/null 2>&1; then
                exit 0
              fi
              sleep 0.5
            done
            echo "semantic cache was not committed during seed" >&2
            exit 1
          '
          pkill -9 -x obsidian 2>/dev/null || true
          sleep 2
          cp -R "$VAULT/.obsidian/plugins/mdse-workbench/cache" "$RUNNER_TEMP/restart-seed-cache"

      - name: Run repeated cold/warm restart pairs
        run: |
          export VAULT
          : > restart-cycle-summary.ndjson
          total=$((CYCLE_PAIRS * 2))
          for cycle in $(seq 1 "$total"); do
            if [ $((cycle % 2)) -eq 1 ]; then
              kind="cold"
              rm -rf "$VAULT/.obsidian/plugins/mdse-workbench/cache"
            else
              kind="warm"
              rm -rf "$VAULT/.obsidian/plugins/mdse-workbench/cache"
              cp -R "$RUNNER_TEMP/restart-seed-cache" "$VAULT/.obsidian/plugins/mdse-workbench/cache"
            fi
            label="${kind}-${cycle}"
            export XDG_CONFIG_HOME="$RUNNER_TEMP/xdg-restart-${cycle}"
            mkdir -p "$XDG_CONFIG_HOME/obsidian"
            node -e 'const fs=require("fs"),p=require("path");fs.writeFileSync(p.join(process.env.XDG_CONFIG_HOME,"obsidian","obsidian.json"),JSON.stringify({vaults:{restart:{path:process.env.VAULT,ts:Date.now(),open:true}}},null,2))'
            rm -f "$VAULT/.mdse_integration_result.json" "$VAULT/.mdse_integration_readable.json" "$VAULT/.mdse_integration_metadata.json"
            node -e 'const fs=require("fs");fs.writeFileSync(process.env.VAULT+"/.mdse_integration_probe.json",JSON.stringify({launchStartedAt:Date.now(),label:process.argv[1]},null,2))' "$label"
            pkill -9 -x obsidian 2>/dev/null || true
            sleep 2
            xvfb-run -a bash -euo pipefail -c "/usr/bin/obsidian --no-sandbox --disable-gpu --js-flags=--expose-gc --remote-debugging-port=9253 >\"$RUNNER_TEMP/restart-${cycle}.log\" 2>&1 & PID=\$!; trap 'kill \$PID 2>/dev/null || true' EXIT; node bench/obsidian-e2e-activate.mjs \"$VAULT\" 9253 >\"$RUNNER_TEMP/restart-${cycle}-activate.log\" 2>&1; node bench/obsidian-restart-cycle-probe.mjs \"$VAULT\" 9253 \"$label\" | tee \"restart-cycle-${cycle}.json\""
            node -e 'const fs=require("fs");const probe=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));let startup={};try{startup=JSON.parse(fs.readFileSync(process.env.VAULT+"/.mdse_integration_result.json","utf8"));}catch{};const row={cycle:Number(process.argv[2]),kind:process.argv[3],...probe,launchToReadableMs:startup.launchToReadableMs??null,launchToMetadataMs:startup.launchToMetadataMs??null,launchToCoreReadyMs:startup.launchToCoreReadyMs??null,launchToOccurrenceReadyMs:startup.launchToOccurrenceReadyMs??null};fs.appendFileSync("restart-cycle-summary.ndjson",JSON.stringify(row)+"\n")' "restart-cycle-${cycle}.json" "$cycle" "$kind"
            pkill -9 -x obsidian 2>/dev/null || true
            sleep 2
          done

      - name: Validate restart semantics and scheduling
        run: |
          node <<'NODE'
          const fs=require("fs");
          const rows=fs.readFileSync("restart-cycle-summary.ndjson","utf8").trim().split(/\n+/).map(JSON.parse);
          const fail=(m)=>{throw new Error(m)};
          if(rows.length!==Number(process.env.CYCLE_PAIRS)*2) fail("missing restart cycle evidence");
          const baseline=rows[0];
          for(const r of rows){
            if(!r.accepted) fail(`cycle ${r.cycle} probe not accepted`);
            if(r.files!==baseline.files || r.elements!==baseline.elements || r.links!==baseline.links) fail(`cycle ${r.cycle} semantic counts drifted`);
            if(r.sourcePending) fail(`cycle ${r.cycle} source reconciliation remained pending`);
            if(r.livePending!==0) fail(`cycle ${r.cycle} live updates remained pending`);
            if(r.occurrencePending!==0 || r.occurrenceQueued!==0 || r.occurrenceActive!==0) fail(`cycle ${r.cycle} occurrence work did not settle`);
            if(r.localReadErrors!==0) fail(`cycle ${r.cycle} Local Model read errors remained`);
            if(r.kind==="cold" && r.mode!=="full") fail(`cycle ${r.cycle} cold launch was not full mode`);
            if(r.kind==="warm" && !String(r.warmRestore||"").startsWith("restored;")) fail(`cycle ${r.cycle} did not use warm restore: ${r.warmRestore}`);
            if(!Number.isFinite(r.launchToCoreReadyMs)) fail(`cycle ${r.cycle} never recorded core readiness`);
          }
          const stableJson=(value)=>JSON.stringify(value??null);
          for(const r of rows){
            if(r.relationshipHistory!==baseline.relationshipHistory) fail(`cycle ${r.cycle} relationship history drifted`);
            if(stableJson(r.dependencySize)!==stableJson(baseline.dependencySize)) fail(`cycle ${r.cycle} reverse dependency index size drifted`);
            for(const metric of ["Nodes","Documents","JSEventListeners"]){
              if(r.metrics?.[metric]!==baseline.metrics?.[metric]) fail(`cycle ${r.cycle} renderer ${metric} drifted`);
            }
          }
          const summarize=(kind)=>{
            const s=rows.filter(r=>r.kind===kind);
            const first=s[0], last=s[s.length-1];
            if(last.jsHeapUsedBytes > first.jsHeapUsedBytes * 1.10) fail(`${kind} heap grew more than 10% from first to last cycle`);
            if(last.launchToCoreReadyMs > first.launchToCoreReadyMs * 1.20) fail(`${kind} core readiness degraded more than 20% from first to last cycle`);
            return {
              count:s.length,
              heapUsedBytes:s.map(r=>r.jsHeapUsedBytes),
              coreReadyMs:s.map(r=>r.launchToCoreReadyMs),
              heapEndVsStartRatio:last.jsHeapUsedBytes/first.jsHeapUsedBytes,
              coreReadyEndVsStartRatio:last.launchToCoreReadyMs/first.launchToCoreReadyMs,
              modes:s.map(r=>r.mode),
              warmRestore:s.map(r=>r.warmRestore)
            };
          };
          const out={accepted:true,semanticBaseline:{files:baseline.files,elements:baseline.elements,links:baseline.links},cold:summarize("cold"),warm:summarize("warm"),cycles:rows};
          fs.writeFileSync("restart-acceptance.json",JSON.stringify(out,null,2)+"\n");
          console.log(JSON.stringify(out,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restart-cycle-evidence
          path: |
            restart-cycle-*.json
            restart-cycle-summary.ndjson
            restart-acceptance.json
            ${{ runner.temp }}/restart-*.log
          if-no-files-found: warn
