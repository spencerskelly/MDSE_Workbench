name: Recovery WB-129 Local Model 0.5 diagnostic

on:
  push:
    branches:
      - recovery/wb129-test-alignment-2026-10-08

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run all unit tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee wb129-recovery-tests.log
      - name: Run production build (no publishing)
        id: build
        continue-on-error: true
        run: npm run build
      - name: Upload unit-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wb129-recovery-tests
          path: wb129-recovery-tests.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Mark diagnostic failed on any failed check
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          echo "unit tests: $TEST_OUTCOME"
          echo "production build: $BUILD_OUTCOME"
          test "$TEST_OUTCOME" = "success"
          test "$BUILD_OUTCOME" = "success"
