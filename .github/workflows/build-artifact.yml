name: Build Workbench artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 60k semantic-cache scale smoke
        run: npm run bench:cache -- 60000 25
      - name: Paired cold/warm startup benchmark
        run: npm run bench:startup -- 60000
      - name: 60k relationship re-resolution benchmark
        run: npm run bench:relationships -- 60000
      - run: npm run build
      - name: Record artifact hashes
        run: sha256sum main.js manifest.json styles.css > artifact-sha256.txt
      - name: Sync checked-in plugin artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p vault/.obsidian/plugins/mdse-workbench
          cp main.js vault/.obsidian/plugins/mdse-workbench/main.js
          cp manifest.json vault/.obsidian/plugins/mdse-workbench/manifest.json
          cp styles.css vault/.obsidian/plugins/mdse-workbench/styles.css
      - name: Commit built artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f main.js artifact-sha256.txt vault/.obsidian/plugins/mdse-workbench/main.js vault/.obsidian/plugins/mdse-workbench/manifest.json vault/.obsidian/plugins/mdse-workbench/styles.css
          if git diff --cached --quiet; then
            echo "Artifact already current."
            exit 0
          fi
          git commit -m "Build Workbench artifact"
          git push

# Triggered for WB-106 artifact refresh.
