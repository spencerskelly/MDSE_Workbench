name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check the tag matches manifest.json
        run: test "v$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      - name: Synthetic 60k-note vault for Phase 0 measurements (WB-081)
        run: |
          npm run -s bench:generate -- 60000 bench/vault
          mkdir -p bench/vault/99_System/03_Schemas
          cp test/fixtures/*.yaml bench/vault/99_System/03_Schemas/
          (cd bench && zip -qr ../synthetic-vault-60k.zip vault)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css synthetic-vault-60k.zip \
            --title "MDSE Workbench ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
